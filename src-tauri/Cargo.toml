[package]
name = "work-station"
version = "0.5.0"
description = "Work Station — desktop hub for managing CLI agent terminal sessions across projects."
authors = ["Work Station maintainers"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-opener = "=2.5.3"
# T3.1: SQLite + key-value store. sqlx pinned to the version tauri-plugin-sql 2.4.0
# already pulls in transitively, so we can run SELECT 1 against its preloaded pool
# without version drift.
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tauri-plugin-store = "=2.4.3"
# T3.7: native folder picker.
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-updater = "=2.9.0"
tauri-plugin-process = "2"
# T-fix: route integration HTTP through Rust to bypass webview CORS.
tauri-plugin-http = "=2"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Logging (T1.9) — tracing + daily-rotated file appender, platform log dir resolution.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.3"
dirs = "=6.0.0"

# PTY runtime (T2.1) — pinned exactly per T1.2.
portable-pty = "=0.9.0"
tokio = { version = "=1.52.1", features = ["full"] }
bytes = "=1.11.1"
uuid = { version = "=1.23.1", features = ["v4", "serde"] }
thiserror = "=2.0.18"

# T11.4: generic HTTP client. rustls keeps the build OpenSSL-free on
# every target OS; gzip/deflate let us reuse the same client for the bigger
# integration responses (GitHub trees, Vercel deployment lists). No
# `cookies`/`hickory-dns` features — we don't need either.
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls", "json", "gzip"] }

# T2.8: SIGTERM for graceful PTY shutdown (Unix only — portable-pty's
# `Child::kill` always sends SIGKILL).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

# T11.2: OS-native credential store. Each backend pulls in a
# platform-specific crate (security-framework / windows-sys / dbus-secret-
# service) that won't compile on the other platforms, so the keyring dep
# itself has to be target-gated. `crypto-rust` keeps Linux libsodium /
# openssl out of the link line, matching reqwest's rustls choice in T11.4.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# T2.11: bench-only deps. base64 reproduces the legacy IPC path
# (base64-encoded JSON string) we're benchmarking against the new
# Channel<Bytes> raw path.
[dev-dependencies]
criterion = { version = "=0.5.1", features = ["html_reports"] }
base64 = "=0.22.1"
# T7.1 — CLI detection tests build synthetic PATH entries from a tempdir so
# they don't depend on the host's installed toolchain.
tempfile = "=3.13.0"
# T11.4 — HTTP client tests use wiremock to stub 5xx/429/cache scenarios
# instead of dialling out to the real network.
wiremock = "=0.6.5"

[[bench]]
name = "ipc_throughput"
harness = false

# Lint policy (T1.3): clippy::all + clippy::pedantic at warn, with a
# pragmatic allow-list for noise that fights idiomatic Tauri/Solid code.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
