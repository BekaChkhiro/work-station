[package]
name = "work-station"
version = "0.1.0"
description = "Work Station — desktop hub for managing CLI agent terminal sessions across projects."
authors = ["Work Station maintainers"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-opener = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
