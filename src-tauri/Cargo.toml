[package]
name = "work-station"
version = "0.1.0"
description = "Work Station — desktop hub for managing CLI agent terminal sessions across projects."
authors = ["Work Station maintainers"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
# Pinned exactly — no auto-bump (T1.2)
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-opener = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging (T1.9) — tracing + daily-rotated file appender, platform log dir resolution.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.3"
dirs = "=6.0.0"

# PTY runtime (T2.1) — pinned exactly per T1.2.
portable-pty = "=0.9.0"
tokio = { version = "=1.52.1", features = ["full"] }
bytes = "=1.11.1"
uuid = { version = "=1.23.1", features = ["v4", "serde"] }
thiserror = "=2.0.18"

# Lint policy (T1.3): clippy::all + clippy::pedantic at warn, with a
# pragmatic allow-list for noise that fights idiomatic Tauri/Solid code.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
