name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS (arm64)
          - platform: macos-13
            args: --target x86_64-apple-darwin
            name: macOS (x64)
          - platform: windows-latest
            args: ""
            name: Windows (x64)
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            name: Windows (arm64)

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || matrix.name == 'Windows (arm64)' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          includeRelease: true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform == 'macos-latest' && 'macos-arm64' || matrix.platform == 'macos-13' && 'macos-x64' || matrix.name == 'Windows (arm64)' && 'windows-arm64' || 'windows-x64' }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/msi/*.msi.sig
            src-tauri/target/*/release/bundle/msi/*.msi.zip
            src-tauri/target/*/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/nsis/*.exe.sig
            src-tauri/target/*/release/bundle/nsis/*.nsis.zip
            src-tauri/target/*/release/bundle/nsis/*.nsis.zip.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*

      - name: Generate updater manifest
        run: |
          mkdir -p release-assets
          node scripts/generate-updater-manifest.js \
            "https://github.com/BekaChkhiro/work-station/releases/download/${{ github.ref_name }}" \
            release-assets/latest.json \
            artifacts/bundles-macos-arm64 \
            artifacts/bundles-macos-x64 \
            artifacts/bundles-windows-x64 \
            artifacts/bundles-windows-arm64

      - name: Copy bundles to release assets
        run: |
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Work Station ${{ github.ref_name }}
          body: |
            ## Work Station ${{ github.ref_name }}

            Auto-updater manifest (`latest.json`) is attached for Tauri v2 auto-update.

            ### Installation
            - **macOS Apple Silicon**: `work-station_*_aarch64.dmg`
            - **macOS Intel**: `work-station_*_x64.dmg`
            - **Windows x64**: `work-station_*_x64_en-US.msi` or `.exe` installer
            - **Windows ARM64**: `work-station_*_arm64.msi` or `.exe` installer

            The app will prompt to auto-update on next launch if a newer version is available.
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: release-assets/*
