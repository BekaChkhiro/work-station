name: build

on:
  push:
    branches: [master]
    tags:
      - "release/*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os-name }} installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os-name: Windows x64
            artifact: work-station-windows-x64
            rust-targets: ""
            tauri-args: ""
            bundle-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

          - runner: macos-14
            os-name: macOS universal
            artifact: work-station-macos-universal
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            tauri-args: "--target universal-apple-darwin"
            bundle-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

          - runner: ubuntu-22.04
            os-name: Linux x64
            artifact: work-station-linux-x64
            rust-targets: ""
            tauri-args: ""
            bundle-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.tauri-args }}

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          for app in *.app; do
            tar -czf "${app}.tar.gz" "$app"
          done

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle-path }}
          retention-days: 30
