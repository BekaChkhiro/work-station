# T2.13 acceptance gate: pty/ module ≥ 80% line coverage on every PR.
#
# `cargo llvm-cov` is used over tarpaulin because:
#  - it runs through the same instrumentation rustc emits with
#    `-C instrument-coverage`, so the numbers are directly comparable
#    to local runs;
#  - it supports `--fail-under-lines` natively, removing the need for
#    a custom JSON parser to enforce the threshold;
#  - it works the same on Linux, macOS, and Windows runners, which we
#    need once T9.1 lights up the matrix build.
#
# Scope: the report excludes everything outside `src-tauri/src/pty/`.
# Tests living in other modules still run (they exercise the pty
# surface), but only pty/ counts toward the gate. This keeps the
# threshold honest as commands/, ipc/, and menu/ grow without dragging
# the gate up or down.

name: pty-coverage

on:
  pull_request:
    paths:
      - "src-tauri/src/pty/**"
      - "src-tauri/src/commands/pty.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/coverage.yml"
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pty-coverage:
    name: pty/ ≥80% line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Single invocation: build the instrumented binary, run all unit
      # + integration tests for the pty surface, scope the report to
      # pty/ files + commands/pty.rs, and fail if line coverage drops
      # below 80%.
      #
      # `--ignore-filename-regex` is an exclude filter; the pattern
      # below removes every non-pty source file from the report. Keep
      # it in sync with src-tauri/src/ as new modules land in later
      # phases (T3.x will add db/ files, T4.x adds ipc/, etc.). Files
      # that need to count toward the gate just need to *not* match the
      # regex.
      - name: cargo llvm-cov (pty/, ≥80% lines)
        run: |
          cargo llvm-cov \
            --lib \
            --no-fail-fast \
            --ignore-filename-regex '(cli/|commands/(log|mod)\.rs|db/|ipc/|lib\.rs|logging\.rs|main\.rs|menu/)' \
            --fail-under-lines 80
